<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Privacy</title>
</head>
<body>
  <div id="content"></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch( '../privacy.md' )
      .then( response => response.text() )
      .then( (result) => {
        const content = marked.parse(result);
        document.getElementById('content').innerHTML = content;
      });
  </script>
</body>
</html>
